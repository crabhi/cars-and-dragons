repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: ^gradlew\.bat$
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
  - repo: local
    hooks:
      - id: ktlint
        name: ktlint
        entry: ./gradlew ktlintCheck --quiet
        language: system
        types_or: [kotlin]
        pass_filenames: false
      - id: detekt
        name: detekt
        entry: ./gradlew detekt --quiet
        language: system
        types_or: [kotlin]
        pass_filenames: false
