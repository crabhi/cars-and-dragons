complexity:
  LongMethod:
    allowedLines: 120
  LongParameterList:
    allowedFunctionParameters: 8
    allowedConstructorParameters: 32
  CyclomaticComplexMethod:
    allowedComplexity: 30
    ignoreSimpleWhenEntries: true
  TooManyFunctions:
    active: false
  ComplexCondition:
    allowedConditions: 6
  NestedBlockDepth:
    allowedDepth: 6
  LargeClass:
    allowedLines: 800

style:
  MagicNumber:
    active: false
  MaxLineLength:
    maxLineLength: 140
  ReturnCount:
    max: 12
  WildcardImport:
    active: false
  ForbiddenComment:
    active: false
  LoopWithTooManyJumpStatements:
    maxJumpCount: 10
  ThrowsCount:
    max: 4
  DestructuringDeclarationWithTooManyEntries:
    maxDestructuringEntries: 4

naming:
  FunctionNaming:
    ignoreAnnotated: ['Test']
  MatchingDeclarationName:
    active: false

exceptions:
  TooGenericExceptionCaught:
    active: false
  SwallowedException:
    active: false
  InstanceOfCheckForException:
    active: false

potential-bugs:
  ImplicitDefaultLocale:
    active: true
